<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="deepCosmic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="45%" stop-color="#0b1220"/>
      <stop offset="85%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <radialGradient id="celestialAura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Radiant Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="90%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Astrolabe Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="radiantGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Square Canvas -->
  <rect width="1024" height="1024" fill="url(#deepCosmic)"/>

  <!-- Celestial Glow Aura -->
  <circle cx="512" cy="512" r="480" fill="url(#celestialAura)"/>

  <!-- Starry Background Points -->
  <g fill="#fef08a">
    <circle cx="210" cy="220" r="2.5" opacity="0.6"/>
    <circle cx="830" cy="240" r="3" opacity="0.7" filter="url(#softGlow)"/>
    <circle cx="790" cy="780" r="2" opacity="0.5"/>
    <circle cx="240" cy="790" r="3" opacity="0.7"/>
    <circle cx="512" cy="120" r="2" opacity="0.8"/>
    <circle cx="890" cy="512" r="2.2" opacity="0.5"/>
    <circle cx="140" cy="480" r="1.8" opacity="0.6"/>
    <circle cx="340" cy="180" r="1.5" opacity="0.4"/>
    <circle cx="680" cy="850" r="2.5" opacity="0.5"/>
  </g>

  <!-- Circular Crop Safe Zone Content (Diameter ~ 820px, well within 1024px circle) -->
  <g id="avatarContent">
    <!-- Outer Astrolabe Rim Rings -->
    <circle cx="512" cy="512" r="410" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.45"/>
    <circle cx="512" cy="512" r="396" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8"/>
    <circle cx="512" cy="512" r="372" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="8 12" opacity="0.6"/>
    <circle cx="512" cy="512" r="348" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.4"/>

    <!-- Degree Graduations (Authentic Astrolabe Limb Ticks) -->
    <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <!-- 0, 90, 180, 270 (Cardinal Points) -->
      <line x1="512" y1="102" x2="512" y2="132" stroke-width="5"/>
      <line x1="512" y1="892" x2="512" y2="922" stroke-width="5"/>
      <line x1="102" y1="512" x2="132" y2="512" stroke-width="5"/>
      <line x1="892" y1="512" x2="922" y2="512" stroke-width="5"/>

      <!-- Intermediate 30-degree Ticks -->
      <line x1="712" y1="165" x2="697" y2="191"/>
      <line x1="859" y1="312" x2="833" y2="327"/>
      <line x1="859" y1="712" x2="833" y2="697"/>
      <line x1="712" y1="859" x2="697" y2="833"/>
      <line x1="312" y1="859" x2="327" y2="833"/>
      <line x1="165" y1="712" x2="191" y2="697"/>
      <line x1="165" y1="312" x2="191" y2="327"/>
      <line x1="312" y1="165" x2="327" y2="191"/>
    </g>

    <!-- Planetary Orbits / Coordinate Ellipses -->
    <g fill="none" stroke-linecap="round">
      <!-- Orbit 1 (Scorpio Conjunction 571 CE) -->
      <ellipse cx="512" cy="512" rx="330" ry="155" transform="rotate(-28 512 512)" 
               stroke="url(#emeraldGrad)" stroke-width="3" stroke-dasharray="14 18" opacity="0.7"/>
      <!-- Orbit 2 (Solar Path / Solar Eclipse 632 CE) -->
      <ellipse cx="512" cy="512" rx="310" ry="138" transform="rotate(38 512 512)" 
               stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="320 40" opacity="0.55"/>
      <!-- Orbit 3 (Lunar Equator) -->
      <ellipse cx="512" cy="512" rx="285" ry="92" stroke="#34d399" stroke-width="1.8" opacity="0.35"/>
    </g>

    <!-- Central Glowing Hilal Crescent -->
    <g filter="url(#radiantGlow)">
      <path d="M 568 204 
               C 736 248 832 416 784 596 
               C 740 760 572 852 408 804 
               C 304 772 224 688 196 592 
               C 184 552 184 520 196 488 
               C 188 516 192 552 208 592 
               C 252 704 372 776 496 752 
               C 632 724 716 592 684 452 
               C 660 348 580 256 480 220 
               C 440 204 404 200 372 204 
               C 444 192 512 192 568 204 Z"
            fill="url(#goldGrad)"/>
    </g>

    <!-- Crescent Inner Highlight -->
    <path d="M 552 228 
             C 696 276 772 424 732 576 
             C 696 716 556 792 420 752 
             C 528 732 624 640 648 520 
             C 672 400 612 296 508 244 
             C 524 236 538 232 552 228 Z" 
          fill="#fffbeb" opacity="0.45"/>

    <!-- Central Radiant Star of Guidance (Rub el Hizb) -->
    <!-- Positioned inside the crescent cusp at (456, 480) -->
    <g transform="translate(456, 480)">
      <!-- Star Aura -->
      <circle cx="0" cy="0" r="95" fill="url(#celestialAura)"/>

      <!-- Square 1 -->
      <rect x="-68" y="-68" width="136" height="136" rx="8"
            fill="url(#emeraldGrad)" stroke="#fef08a" stroke-width="3.5" opacity="0.95" filter="url(#softGlow)"/>

      <!-- Square 2 (Rotated 45 deg) -->
      <rect x="-68" y="-68" width="136" height="136" rx="8" transform="rotate(45)"
            fill="url(#emeraldGrad)" stroke="#fef08a" stroke-width="3.5" opacity="0.95" filter="url(#softGlow)"/>

      <!-- Central Octagonal Core -->
      <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="url(#goldGrad)" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="28" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#softGlow)"/>

      <!-- Primary Star Light Beams -->
      <line x1="-116" y1="0" x2="116" y2="0" stroke="#fffbeb" stroke-width="3.5" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)"/>
      <line x1="0" y1="-116" x2="0" y2="116" stroke="#fffbeb" stroke-width="3.5" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)"/>
      <line x1="-72" y1="-72" x2="72" y2="72" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
      <line x1="-72" y1="72" x2="72" y2="-72" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- Top North Calibrating Pointer -->
    <path d="M 512 116 L 522 140 L 512 134 L 502 140 Z" fill="url(#goldGrad)" filter="url(#softGlow)"/>
  </g>
</svg>
