<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bannerBgGlow" cx="25%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#14233c"/>
      <stop offset="40%" stop-color="#0b1220"/>
      <stop offset="85%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <radialGradient id="emblemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Radiant Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="35%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="90%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Astrolabe Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bannerBgGlow)"/>

  <!-- Border Frame -->
  <rect x="16" y="16" width="1248" height="608" rx="24" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="24" y="24" width="1232" height="592" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Subtle Astronomical Grid Lines in Background -->
  <g stroke="#374151" stroke-width="1" stroke-opacity="0.2" fill="none">
    <circle cx="280" cy="320" r="460" stroke-dasharray="4 8"/>
    <circle cx="280" cy="320" r="380"/>
    <circle cx="280" cy="320" r="290" stroke-dasharray="8 12"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke-dasharray="3 6"/>
    <line x1="280" y1="0" x2="280" y2="640" stroke-dasharray="3 6"/>
  </g>

  <!-- Distant Starlight Points -->
  <g fill="#fef08a">
    <circle cx="120" cy="140" r="1.5" opacity="0.6"/>
    <circle cx="580" cy="110" r="2" opacity="0.5"/>
    <circle cx="750" cy="80" r="1.8" opacity="0.7" filter="url(#softGlow)"/>
    <circle cx="1180" cy="160" r="2.2" opacity="0.6"/>
    <circle cx="1120" cy="520" r="1.5" opacity="0.4"/>
    <circle cx="680" cy="560" r="2" opacity="0.5"/>
    <circle cx="940" cy="480" r="1.8" opacity="0.4"/>
    <circle cx="480" cy="500" r="1.2" opacity="0.5"/>
    <circle cx="80" cy="460" r="1.8" opacity="0.4"/>
  </g>

  <!-- Left Side: Grand Astrolabe & Hilal Emblem -->
  <!-- Scaled and centered at (270, 320) -->
  <g transform="translate(270, 320) scale(0.85) translate(-256, -256)">
    <!-- Base Glow -->
    <circle cx="256" cy="256" r="240" fill="url(#emblemAura)"/>
    <circle cx="256" cy="256" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-opacity="0.5"/>
    <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.75"/>
    <circle cx="256" cy="256" r="202" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.6"/>

    <!-- Degree Graduations -->
    <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <line x1="256" y1="28" x2="256" y2="44"/>
      <line x1="256" y1="468" x2="256" y2="484"/>
      <line x1="28" y1="256" x2="44" y2="256"/>
      <line x1="468" y1="256" x2="484" y2="256"/>
      <line x1="370" y1="59" x2="363" y2="72"/>
      <line x1="453" y1="142" x2="440" y2="149"/>
      <line x1="453" y1="370" x2="440" y2="363"/>
      <line x1="370" y1="453" x2="363" y2="440"/>
      <line x1="142" y1="453" x2="149" y2="440"/>
      <line x1="59" y1="370" x2="72" y2="363"/>
      <line x1="59" y1="142" x2="72" y2="149"/>
      <line x1="142" y1="59" x2="149" y2="72"/>
    </g>

    <!-- Planetary Orbits -->
    <ellipse cx="256" cy="256" rx="180" ry="86" transform="rotate(-28 256 256)" 
             stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-dasharray="8 10" opacity="0.75"/>
    <ellipse cx="256" cy="256" rx="170" ry="76" transform="rotate(38 256 256)" 
             stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="160 25" opacity="0.55"/>
    <ellipse cx="256" cy="256" rx="155" ry="50" stroke="#34d399" stroke-width="1.5" opacity="0.35"/>

    <!-- Crescent Hilal -->
    <path d="M 284 102 
             C 368 124 416 208 392 298 
             C 370 380 286 426 204 402 
             C 152 386 112 344 98 296 
             C 92 276 92 260 98 244 
             C 94 258 96 276 104 296 
             C 126 352 186 388 248 376 
             C 316 362 358 296 342 226 
             C 330 174 290 128 240 110 
             C 220 102 202 100 186 102 
             C 222 96 256 96 284 102 Z"
          fill="url(#goldGrad)" 
          filter="url(#strongGlow)"/>

    <path d="M 276 114 
             C 348 138 386 212 366 288 
             C 348 358 278 396 210 376 
             C 264 366 312 320 324 260 
             C 336 200 306 148 254 122 
             C 262 118 269 116 276 114 Z" 
          fill="#fef08a" opacity="0.45"/>

    <!-- 8-Pointed Star -->
    <g transform="translate(228, 240)">
      <rect x="-34" y="-34" width="68" height="68" rx="4"
            fill="url(#emeraldGrad)" stroke="#fef08a" stroke-width="2.2" filter="url(#softGlow)"/>
      <rect x="-34" y="-34" width="68" height="68" rx="4" transform="rotate(45)"
            fill="url(#emeraldGrad)" stroke="#fef08a" stroke-width="2.2" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="22" fill="#0b1329" stroke="url(#goldGrad)" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="14" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#softGlow)"/>
      <line x1="-58" y1="0" x2="58" y2="0" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Center Right: Typography and Information -->
  <g transform="translate(540, 0)">
    <!-- Top Super-header / Initiative Label -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="4" fill="#10b981"/>
      <text x="28" y="18.5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#34d399">
        MAKTABAH MAFTOOHAH
      </text>
      <text x="188" y="18.5" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#9ca3af">
        • Digital Heritage
      </text>
    </g>

    <!-- Arabic Title with Grand Classical Typography -->
    <text x="0" y="195" 
          font-family="'Amiri', 'Traditional Arabic', serif" 
          font-size="34" 
          font-weight="700" 
          fill="url(#goldGrad)" 
          letter-spacing="0.5"
          filter="url(#softGlow)">
      الخَطُّ الزَّمَنِيُّ لِلسِّيرَةِ النَّبَوِيَّةِ وَالتَّقْوِيم
    </text>

    <!-- English Main Title -->
    <text x="0" y="258" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="-1.2" 
          fill="#f9fafb">
      PROPHETIC TIMELINE <tspan fill="#10b981">&amp;</tspan> CALENDAR
    </text>

    <!-- Tagline 1: Malay -->
    <text x="0" y="302" 
          font-family="'Inter', sans-serif" 
          font-size="16.5" 
          font-weight="600" 
          fill="#e5e7eb" 
          letter-spacing="0.2">
      Penyelarasan Falak &amp; Sejarah Menurut Mahmoud Pasha al-Falaki
    </text>

    <!-- Tagline 2: English Technical Summary -->
    <text x="0" y="332" 
          font-family="'Inter', sans-serif" 
          font-size="14" 
          font-weight="400" 
          fill="#9ca3af" 
          letter-spacing="0.1">
      A Falaki-Grade Chronology &amp; Multi-Calendar Harmonization of the Sirah (571–632 CE)
    </text>

    <!-- Feature Pillars / Badges Grid -->
    <g transform="translate(0, 380)">
      <!-- Feature Card 1: 7 Synchronized Calendars -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="310" height="64" rx="12" fill="#111827" fill-opacity="0.85" stroke="#374151" stroke-width="1.2"/>
        <text x="18" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#34d399">📅 7 Kalendar Diselaraskan</text>
        <text x="18" y="48" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af">Hijri (AH/BH), Julian, Gregorian, AM, etc.</text>
      </g>

      <!-- Feature Card 2: Astronomical Rigor -->
      <g transform="translate(325, 0)">
        <rect x="0" y="0" width="345" height="64" rx="12" fill="#111827" fill-opacity="0.85" stroke="#374151" stroke-width="1.2"/>
        <text x="18" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">🪐 Ketepatan Astronomi Falaki</text>
        <text x="18" y="48" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af">Gerhana 632 M &amp; Qiran Zuhal-Musytari 571 M</text>
      </g>

      <!-- Feature Card 3: Interactive Visualizations -->
      <g transform="translate(0, 76)">
        <rect x="0" y="0" width="310" height="64" rx="12" fill="#111827" fill-opacity="0.85" stroke="#374151" stroke-width="1.2"/>
        <text x="18" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">📜 Garis Masa &amp; Kalkulator Hari</text>
        <text x="18" y="48" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af">Jarak hari mutlak &amp; paparan tahunan/bulanan</text>
      </g>

      <!-- Feature Card 4: Zero-Build Architecture -->
      <g transform="translate(325, 76)">
        <rect x="0" y="0" width="345" height="64" rx="12" fill="#111827" fill-opacity="0.85" stroke="#374151" stroke-width="1.2"/>
        <text x="18" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#a78bfa">⚡ Zero-Build Vanilla ES6 &amp; PWA</text>
        <text x="18" y="48" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#9ca3af">Berfungsi 100% luar talian • Bahasa BM / EN / AR</text>
      </g>
    </g>

    <!-- Bottom Link Indicator -->
    <g transform="translate(0, 545)">
      <text x="0" y="16" font-family="'Inter', monospace" font-size="12" font-weight="500" fill="#6b7280">
        🌐 maktabah-maftoohah.github.io/prophetic-timeline
      </text>
    </g>
  </g>
</svg>
