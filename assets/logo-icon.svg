<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#132338" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0b111e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b111e" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Radiant Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Astrolabe Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plate / Background Disc -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="236" fill="url(#centerAura)"/>

  <!-- Subtle Islamic Geometry / Outer Rim -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.5"/>

  <!-- Astrolabe Degree Graduations (36 ticks around rim) -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <!-- Quadrant ticks -->
    <line x1="256" y1="28" x2="256" y2="44" stroke-width="3"/>
    <line x1="256" y1="468" x2="256" y2="484" stroke-width="3"/>
    <line x1="28" y1="256" x2="44" y2="256" stroke-width="3"/>
    <line x1="468" y1="256" x2="484" y2="256" stroke-width="3"/>

    <!-- 30 deg ticks -->
    <line x1="370" y1="59" x2="363" y2="72"/>
    <line x1="453" y1="142" x2="440" y2="149"/>
    <line x1="453" y1="370" x2="440" y2="363"/>
    <line x1="370" y1="453" x2="363" y2="440"/>
    <line x1="142" y1="453" x2="149" y2="440"/>
    <line x1="59" y1="370" x2="72" y2="363"/>
    <line x1="59" y1="142" x2="72" y2="149"/>
    <line x1="142" y1="59" x2="149" y2="72"/>
  </g>

  <!-- Celestial Orbit Rings (Timeline Coordinate Ellipses) -->
  <g fill="none" stroke-linecap="round">
    <!-- Tilted Planetary Orbit 1 (representing Jupiter/Saturn Conjunction 571 CE) -->
    <ellipse cx="256" cy="256" rx="180" ry="86" transform="rotate(-28 256 256)" 
             stroke="url(#emeraldGrad)" stroke-width="1.75" stroke-dasharray="6 10" opacity="0.6"/>
    <!-- Tilted Planetary Orbit 2 (representing Solar/Lunar Path) -->
    <ellipse cx="256" cy="256" rx="170" ry="76" transform="rotate(38 256 256)" 
             stroke="url(#goldGrad)" stroke-width="1.75" stroke-dasharray="180 20" opacity="0.45"/>
    <!-- Spherical Armillary Horizon Ring -->
    <ellipse cx="256" cy="256" rx="160" ry="50" stroke="#34d399" stroke-width="1.2" opacity="0.3"/>
  </g>

  <!-- Distant Starlight Points -->
  <g fill="#fef08a" opacity="0.75">
    <circle cx="108" cy="118" r="1.8"/>
    <circle cx="410" cy="130" r="2.2" filter="url(#softGlow)"/>
    <circle cx="395" cy="390" r="1.5"/>
    <circle cx="120" cy="385" r="2"/>
    <circle cx="210" cy="95" r="1.5"/>
    <circle cx="330" cy="425" r="1.8"/>
  </g>

  <!-- Central Luminous Crescent (Hilal - The Symbol of the Islamic Lunar Calendar & Dawn of Prophecy) -->
  <!-- Crescent shape constructed with two harmonic bezier arcs -->
  <path d="M 284 102 
           C 368 124 416 208 392 298 
           C 370 380 286 426 204 402 
           C 152 386 112 344 98 296 
           C 92 276 92 260 98 244 
           C 94 258 96 276 104 296 
           C 126 352 186 388 248 376 
           C 316 362 358 296 342 226 
           C 330 174 290 128 240 110 
           C 220 102 202 100 186 102 
           C 222 96 256 96 284 102 Z"
        fill="url(#goldGrad)" 
        filter="url(#softGlow)"/>

  <!-- Inner Shading & Highlight for Crescent -->
  <path d="M 276 114 
           C 348 138 386 212 366 288 
           C 348 358 278 396 210 376 
           C 264 366 312 320 324 260 
           C 336 200 306 148 254 122 
           C 262 118 269 116 276 114 Z" 
        fill="#fef08a" opacity="0.35"/>

  <!-- Guiding 8-Pointed Star (Rub el Hizb / Najm of Revelation) -->
  <!-- Center at (228, 240) inside the cradle of the crescent -->
  <g transform="translate(228, 240)" filter="url(#strongGlow)">
    <!-- Radiant Star Aura -->
    <circle cx="0" cy="0" r="48" fill="url(#centerAura)"/>

    <!-- Square 1 of 8-pointed star (Rotated 0 deg) -->
    <rect x="-34" y="-34" width="68" height="68" rx="4"
          fill="url(#emeraldGrad)" stroke="#fef08a" stroke-width="1.8" opacity="0.95"/>

    <!-- Square 2 of 8-pointed star (Rotated 45 deg) -->
    <rect x="-34" y="-34" width="68" height="68" rx="4" transform="rotate(45)"
          fill="url(#emeraldGrad)" stroke="#fef08a" stroke-width="1.8" opacity="0.95"/>

    <!-- Inner Core Octagon -->
    <circle cx="0" cy="0" r="22" fill="#0b1329" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#softGlow)"/>

    <!-- Star Light Cross Beams -->
    <line x1="-58" y1="0" x2="58" y2="0" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="0" y1="-58" x2="0" y2="58" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="-36" y1="-36" x2="36" y2="36" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-36" y1="36" x2="36" y2="-36" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Chronological Timeline Pointer / Calibration Indicator -->
  <g stroke="url(#goldGrad)" stroke-linecap="round" opacity="0.8">
    <!-- North Marker Crown -->
    <path d="M 256 36 L 261 48 L 256 45 L 251 48 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
